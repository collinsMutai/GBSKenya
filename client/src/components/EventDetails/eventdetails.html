<script>
(function () {

  "use strict";

  /* =======================================================
     CONFIGURATION
  ======================================================= */

  const API =
    "/wp-json/wp/v2/events?per_page=100&_embed";


  const app =
    document.getElementById("eventDetailsApp");


  if (!app) {
    return;
  }


  /* =======================================================
     GET SLUG FROM URL
  ======================================================= */

  const params =
    new URLSearchParams(window.location.search);

  const slug =
    params.get("slug");


  /* =======================================================
     ICONS
     
     Inline SVG replaces lucide-react.
  ======================================================= */

  const icons = {

    arrowLeft: `
      <svg
        class="event-details__meta-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"

        aria-hidden="true"
      >

        <path d="M12 19l-7-7 7-7"></path>
      </svg>
    `,

    arrowUpRight: `
      <span
        class="event-details__register-arrow"
        aria-hidden="true"
      >↗</span>
    `,

    clock: `
      <svg
        class="event-details__meta-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="9"></circle>
        <polyline points="12 7 12 12 15 14"></polyline>
      </svg>
    `,

    location: `
      <svg
        class="event-details__meta-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path>
        <circle cx="12" cy="10" r="2.5"></circle>
      </svg>
    `,

    user: `
      <svg
        class="event-details__meta-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21c.8-4 3.5-6 8-6s7.2 2 8 6"></path>
      </svg>
    `,

    users: `
      <svg
        class="event-details__registration-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
    `
  };


  /* =======================================================
     ESCAPE HTML
     
     Important because event data comes from WordPress.
  ======================================================= */

  function escapeHTML(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =======================================================
     PARSE DATE
     
     Supports:
     
     20260830
     2026-08-30
  ======================================================= */

  function parseEventDate(value) {

    if (!value) {
      return null;
    }

    value =
      String(value).trim();


    if (/^\d{8}$/.test(value)) {

      const year =
        Number(value.substring(0,4));

      const month =
        Number(value.substring(4,6)) - 1;

      const day =
        Number(value.substring(6,8));

      return new Date(
        year,
        month,
        day
      );
    }


    if (/^\d{4}-\d{2}-\d{2}$/.test(value)) {

      const parts =
        value.split("-");

      return new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
      );
    }


    return null;
  }


  /* =======================================================
     FORMAT DATE
  ======================================================= */

  function formatEventDate(date) {

    if (!date) {
      return {
        day: "--",
        month: "---",
        year: ""
      };
    }


    return {

      day:
        String(
          date.getDate()
        ).padStart(2,"0"),

      month:
        date
          .toLocaleString(
            "en-US",
            {
              month: "short"
            }
          )
          .toUpperCase(),

      year:
        String(
          date.getFullYear()
        )
    };
  }


  /* =======================================================
     GET CURRENT EVENT
  ======================================================= */

  async function loadEvent() {

    if (!slug) {

      showNotFound(
        "No event was specified."
      );

      return;
    }


    try {

      /*
       * First try the REST API directly
       * using the slug.
       */

      let response =
        await fetch(
          "/wp-json/wp/v2/events?slug=" +
          encodeURIComponent(slug) +
          "&_embed"
        );


      if (!response.ok) {

        throw new Error(
          "WordPress REST API returned " +
          response.status
        );
      }


      let data =
        await response.json();


      /*
       * Some WordPress configurations may
       * not return the event through ?slug=.
       *
       * If that happens, fetch the full list.
       */

      if (!Array.isArray(data) || !data.length) {

        response =
          await fetch(API);


        if (!response.ok) {

          throw new Error(
            "WordPress REST API returned " +
            response.status
          );
        }


        const allEvents =
          await response.json();


        data =
          allEvents.filter(
            function (event) {

              return (
                String(event.slug) ===
                String(slug)
              );

            }
          );
      }


      if (!Array.isArray(data) || !data.length) {

        showNotFound();

        return;
      }


      const event =
        data[0];


      renderEvent(event);

    }

    catch (error) {

      console.error(
        "Event details error:",
        error
      );


      showError();

    }
  }


  /* =======================================================
     RENDER EVENT
  ======================================================= */

  function renderEvent(event) {

    const acf =
      event.acf || {};


    const eventDate =
      parseEventDate(
        acf.event_date
      );


    const date =
      formatEventDate(
        eventDate
      );


    /*
     * WordPress title
     */

    const title =
      event.title &&
      event.title.rendered
        ? event.title.rendered
        : "Untitled event";


    /*
     * Event fields
     */

    const type =
      acf.event_type ||
      "Community event";


    const time =
      acf.event_time ||
      "Time TBC";


    const location =
      acf.event_location ||
      "Location TBC";


    const organiser =
      acf.event_organiser ||
      acf.event_organizer ||
      "Community Support Team";


    const description =
      acf.event_description ||
      "A welcoming community event bringing together patients, caregivers, family members, and community supporters.";


    const audience =
      acf.event_audience ||
      "Patients, caregivers, family members, volunteers, healthcare professionals, and anyone supporting people living with CIDP and related conditions.";


    const registration =
      acf.event_registration ||
      "Registration is required to help us plan seating, materials, and refreshments. Please register before attending.";


    const registrationLink =
      acf.registration_link ||
      acf.event_registration_link ||
      "#";


    /*
     * Speakers
     */

    let speakers =
      acf.event_speakers ||
      acf.speakers ||
      [];


    if (!Array.isArray(speakers)) {

      if (typeof speakers === "string") {

        speakers =
          speakers
            .split(/\r?\n|,/)
            .map(
              function (item) {
                return item.trim();
              }
            )
            .filter(Boolean);

      } else {

        speakers = [];

      }
    }


    /*
     * Fallback speakers
     */

    if (!speakers.length) {

      speakers = [
        "Community support facilitators",
        "Patient and caregiver representatives",
        "Invited healthcare professionals"
      ];

    }


    /*
     * Resources
     */

    let resources = [];


    if (
      Array.isArray(
        acf.event_resources
      )
    ) {

      resources =
        acf.event_resources;

    }


    /*
     * Build page
     */

    app.innerHTML = `

      <!-- =========================================
           HERO
      ========================================== -->

      <section class="event-details__hero">

        <div class="event-details__container">

          <a
            href="/get-involved/"
            class="event-details__back"
          >
            <span class="event-details__back-icon">
              ←
            </span>

            Back to events
          </a>


          <div class="event-details__hero-grid">

            <!-- DATE -->

            <div class="event-details__date">

              <span class="event-details__day">
                ${escapeHTML(date.day)}
              </span>

              <span class="event-details__month">
                ${escapeHTML(date.month)}
              </span>

              <span class="event-details__year">
                ${escapeHTML(date.year)}
              </span>

            </div>


            <!-- HEADING -->

            <div class="event-details__hero-content">

              <span class="event-details__type">
                ${escapeHTML(type)}
              </span>

              <h1>
                ${escapeHTML(title)}
              </h1>

              <p>
                Meet, learn, share, and connect
                with the community.
              </p>

            </div>

          </div>

        </div>

      </section>


      <!-- =========================================
           META
      ========================================== -->

      <section class="event-details__meta">

        <div class="event-details__container">

          <div class="event-details__meta-grid">


            <!-- DATE/TIME -->

            <div class="event-details__meta-item">

              ${icons.clock}

              <div>

                <span>
                  Date &amp; time
                </span>

                <strong>
                  ${escapeHTML(date.month)}
                  ${escapeHTML(date.day)},
                  ${escapeHTML(date.year)}

                  <br>

                  ${escapeHTML(time)}
                </strong>

              </div>

            </div>


            <!-- LOCATION -->

            <div class="event-details__meta-item">

              ${icons.location}

              <div>

                <span>
                  Location
                </span>

                <strong>
                  ${escapeHTML(location)}
                </strong>

              </div>

            </div>


            <!-- ORGANISER -->

            <div class="event-details__meta-item">

              ${icons.user}

              <div>

                <span>
                  Organiser
                </span>

                <strong>
                  ${escapeHTML(organiser)}
                </strong>

              </div>

            </div>


          </div>

        </div>

      </section>


      <!-- =========================================
           MAIN CONTENT
      ========================================== -->

      <section class="event-details__content">

        <div class="event-details__container">

          <div class="event-details__content-grid">


            <!-- =====================================
                 MAIN
            ====================================== -->

            <div class="event-details__main">


              <!-- ABOUT -->

              <section class="event-details__section">

                <div class="event-details__section-number">
                  01
                </div>

                <div>

                  <h2>
                    About this event
                  </h2>

                  <p>
                    ${escapeHTML(description)}
                  </p>

                </div>

              </section>


              <!-- AUDIENCE -->

              <section class="event-details__section">

                <div class="event-details__section-number">
                  02
                </div>

                <div>

                  <h2>
                    Who should attend
                  </h2>

                  <p>
                    ${escapeHTML(audience)}
                  </p>

                </div>

              </section>


              <!-- SPEAKERS -->

              <section class="event-details__section">

                <div class="event-details__section-number">
                  03
                </div>

                <div>

                  <h2>
                    Speakers &amp; partners
                  </h2>

                  <ul class="event-details__list">

                    ${speakers.map(
                      function (speaker) {

                        return `
                          <li>
                            ${escapeHTML(speaker)}
                          </li>
                        `;

                      }
                    ).join("")}

                  </ul>

                </div>

              </section>


            </div>


            <!-- =====================================
                 SIDEBAR
            ====================================== -->

            <aside class="event-details__sidebar">


              <!-- REGISTRATION -->

              <div class="event-details__registration">

                ${icons.users}


                <p class="event-details__registration-label">
                  Reserve your place
                </p>


                <h2>
                  Join the
                  <br>
                  community.
                </h2>


                <p class="event-details__registration-description">
                  ${escapeHTML(registration)}
                </p>


                <a
                  href="${escapeHTML(registrationLink)}"
                  class="event-details__register"
                >

                  <span>
                    Register for this event
                  </span>

                  ${icons.arrowUpRight}

                </a>

              </div>


              ${
                resources.length
                  ? `

                    <div class="event-details__resources">

                      <span>
                        Resources
                      </span>

                      ${resources.map(
                        function (resource) {

                          const label =
                            resource.label ||
                            resource.title ||
                            "Event information";

                          const href =
                            resource.href ||
                            resource.url ||
                            "#";


                          return `

                            <a
                              href="${escapeHTML(href)}"
                            >

                              <span>
                                ${escapeHTML(label)}
                              </span>

                              <span class="event-details__resource-arrow">
                                ↗
                              </span>

                            </a>

                          `;

                        }
                      ).join("")}

                    </div>

                  `
                  : ""
              }


            </aside>


          </div>

        </div>

      </section>


      <!-- =========================================
           FOOTER
      ========================================== -->

      <section class="event-details__footer">

        <div class="event-details__container">

          <a
            href="/get-involved/"
            class="event-details__footer-link"
          >

            <span>
              ←
            </span>

            View all upcoming events

          </a>

        </div>

      </section>

    `;

  }


  /* =======================================================
     NOT FOUND
  ======================================================= */

  function showNotFound(
    message
  ) {

    app.innerHTML = `

      <main class="event-details__not-found">

        <div class="event-details__container">

          <p class="event-details__eyebrow">
            Event
          </p>

          <h1>
            Event not found.
          </h1>

          <p>
            ${
              message ||
              "The event you're looking for may have been removed or is no longer available."
            }
          </p>

          <a
            href="/get-involved/"
            class="event-details__back"
          >

            <span class="event-details__back-icon">
              ←
            </span>

            Back to events

          </a>

        </div>

      </main>

    `;

  }


  /* =======================================================
     ERROR
  ======================================================= */

  function showError() {

    app.innerHTML = `

      <main class="event-details__not-found">

        <div class="event-details__container">

          <p class="event-details__eyebrow">
            Event
          </p>

          <h1>
            Unable to load event.
          </h1>

          <p>
            We couldn't retrieve this event from the
            community calendar. Please try again later.
          </p>

          <a
            href="/get-involved/"
            class="event-details__back"
          >

            <span class="event-details__back-icon">
              ←
            </span>

            Back to events

          </a>

        </div>

      </main>

    `;

  }


  /* =======================================================
     START
  ======================================================= */

  loadEvent();

})();
</script>
